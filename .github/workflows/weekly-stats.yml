name: Weekly stats report

on:
  schedule:
    - cron: "41 14 * * 0"   # Sundays 7:41 AM Arizona time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Google sign-in secrets
        id: secrets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          missing=""
          for k in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN; do
            [ -z "${!k}" ] && missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Weekly stats skipped — missing secret(s):$missing. Finish AUTOPILOT.md setup steps 1-4."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - if: steps.secrets.outputs.ready == 'true'
        run: pip install -q -r bot/requirements.txt
      - name: Build report
        if: steps.secrets.outputs.ready == 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python -m bot.weekly_stats >> "$GITHUB_STEP_SUMMARY"
      - name: Save report
        if: steps.secrets.outputs.ready == 'true'
        run: |
          git config user.name "internet-ranked-bot"
          git config user.email "internet-ranked-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || (git commit -m "Weekly stats report" && git pull --rebase -q && git push)
